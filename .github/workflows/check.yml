name: check and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.deploy-scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: determine deployment scope
        id: deploy-scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- \
            quire.html \
            manifest.webmanifest \
            quire-icon.svg \
            quire-icon-192.png \
            quire-icon-512.png \
            apple-touch-icon.png \
            service-worker.js \
            staticwebapp.config.json \
            tools/build-deploy.js; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Type gate, app build, and the conformance suite.
      - run: npm run check

      # quire.html is a committed build artefact, so it can drift from the
      # sources it is generated from. `npm run check` rebuilds it, and a dirty
      # tree afterwards means someone edited src/ without rebuilding — which
      # would ship an app that does not match the code under review.
      - name: the committed app matches its sources
        run: |
          if ! git diff --quiet -- quire.html; then
            echo "quire.html is out of date. Run 'npm run check' and commit the result."
            git --no-pager diff --stat -- quire.html
            exit 1
          fi

      - name: stage production files
        if: steps.deploy-scope.outputs.deploy == 'true'
        run: npm run build:deploy

      - name: save production files
        if: steps.deploy-scope.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production
          path: dist
          if-no-files-found: error

  deploy:
    if: needs.check.outputs.deploy == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: load production files
        uses: actions/download-artifact@v4
        with:
          name: production
          path: dist

      - name: deploy production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
