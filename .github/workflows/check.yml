name: check and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Type gate, app build, and the conformance suite.
      - run: npm run check

      # quire.html is a committed build artefact, so it can drift from the
      # sources it is generated from. `npm run check` rebuilds it, and a dirty
      # tree afterwards means someone edited src/ without rebuilding — which
      # would ship an app that does not match the code under review.
      - name: the committed app matches its sources
        run: |
          if ! git diff --quiet -- quire.html; then
            echo "quire.html is out of date. Run 'npm run check' and commit the result."
            git --no-pager diff --stat -- quire.html
            exit 1
          fi

      - name: stage production files
        run: npm run build:deploy

      - name: save production files
        uses: actions/upload-artifact@v4
        with:
          name: production
          path: dist
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: load production files
        uses: actions/download-artifact@v4
        with:
          name: production
          path: dist

      - name: deploy production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
